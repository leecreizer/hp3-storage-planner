      <div id="samples" hidden></div>
      <div id="sun-panel" hidden>
        <div class="sun-title">조명 <small>바꾸는 즉시 반영</small></div>
        <div class="presets"><button data-preset="bright">밝게</button><button data-preset="morning">아침</button><button data-preset="noon">한낮</button><button data-preset="afternoon">오후</button><button data-preset="sunset">해질녘</button><button data-preset="night">밤</button></div>
        <div class="grp">해 · 창 <small>창은 오른쪽 벽 · 창 빛 = 하늘 산란광</small></div>
        <label>방위 <input id="sun-az" type="range" min="-85" max="85" step="1"><input id="sun-az-v" class="val" type="number"></label>
        <label>고도 <input id="sun-el" type="range" min="4" max="80" step="1"><input id="sun-el-v" class="val" type="number"></label>
        <label>세기 <input id="sun-in" type="range" min="0" max="8" step="0.1"><input id="sun-in-v" class="val" type="number"></label>
        <label>색온도 <input id="sun-k" type="range" min="2000" max="8000" step="100"><input id="sun-k-v" class="val" type="number"></label>
        <label>창 빛 <input id="sky" type="range" min="0" max="5" step="0.05"><input id="sky-v" class="val" type="number"></label>

        <label>진하기 <input id="sh-str" type="range" min="0" max="10" step="0.1"><input id="sh-str-v" class="val" type="number"></label>
        <label>부드럽게 <input id="sh-soft" type="range" min="0" max="10" step="0.5"><input id="sh-soft-v" class="val" type="number"></label>

        <label>천장 조명 <select id="ceil-sel"></select></label>
        <label>세기 <input id="lamp" type="range" min="0" max="3" step="0.05"><input id="lamp-v" class="val" type="number"></label>
        <label>색온도 <input id="kelvin" type="range" min="2000" max="8000" step="100"><input id="kelvin-v" class="val" type="number"></label>

        <div class="grp">공간</div>
        <label>환경광 <input id="envi" type="range" min="0" max="2.5" step="0.05"><input id="envi-v" class="val" type="number"></label>

      <div id="look-pop" class="mode-pop" hidden>

        <button data-look="mat" class="on"><b>재질</b><small>원본 모델 재질 그대로</small></button>

        <div class="look-sep"></div>
        <button id="look-props" class="on"><b>소품 보이기</b><small>장 안 옷·이불·상자 · 침대·침구·협탁·선반장·커튼</small></button>
      </div>
      <div id="render-pop" class="mode-pop" hidden>
        <div class="sun-title">실사 렌더 <small>웹 렌더 품질 시험 3방식</small></div>
        <button data-mode="raster" class="on"><b>실시간 (기본)</b><small>그림자 · AO · 바로 반영</small></button>
        <button data-mode="mutracer"><b>① 경로 추적 · MuTracer</b><small>사진 같은 품질 · 멈춰 있으면 수렴</small></button>
        <button data-mode="bake"><b>② 라이트맵 굽기 · WebGPU</b><small>구운 뒤 가볍고 빠름 · 굽기에 시간 걸림</small></button>
        <button data-mode="surfel"><b>③ 서펠 GI · webgiya</b><small>실시간 간접광 · WebGPU</small></button>
        <button data-mode="hq"><b>④ 실시간 고품질 · SSR + SSS</b><small>화면 반사 · 접촉 그림자 · 바로 반영 · 무거움</small></button>

        <div class="look-sep"></div>
        <div class="q-title">화면 성능 <small id="q-gpu"></small></div>
        <div class="q-row" id="q-row"></div>
        <p class="q-note" id="q-note"></p>
        <label class="q-fps"><input type="checkbox" id="q-fps"> FPS 표시</label>

      <div id="roomdoor-pop" class="mode-pop" hidden></div>
      <div id="window-pop" class="mode-pop" hidden></div>
      <div id="fix-pop" class="mode-pop" hidden></div>

      <div class="modal-head"><b id="info-title"></b><button id="info-close">✕</button></div>
